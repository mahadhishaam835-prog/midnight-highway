<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Highway</title>
<style>
:root{--bg:#02030a;--fg:#eef1ff;--mut:#98a1c4;--ac:#ffb43a;--panel:rgba(8,10,20,.82);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#02030a;--fg:#eef1ff}}
:root[data-theme="dark"]{--bg:#02030a;--fg:#eef1ff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;color-scheme:dark}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;letter-spacing:.08em;pointer-events:none;text-shadow:0 0 10px #000}
#hud small{display:block;font-size:10px;color:var(--mut);font-weight:600}
#hud b{font-size:22px;color:var(--ac);font-variant-numeric:tabular-nums}
#ov{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 4vh);transform:translateX(-50%);width:min(92vw,390px);text-align:center;background:var(--panel);backdrop-filter:blur(8px);border:1px solid #2a3150;border-radius:16px;padding:14px}
#ov h1{margin:0 0 4px;font-size:22px;letter-spacing:.16em;color:var(--ac)}
#ov p{margin:4px 0;color:var(--mut);font-size:13px}
#pick{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0}
#pick span{min-width:190px;font-weight:700;font-size:17px}
#pick span small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
#pick span i{display:block;font-style:normal;font-weight:500;font-size:12px;color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;background:#20274a;color:var(--fg);padding:8px 14px;font-size:18px}
#go{background:var(--ac);color:#1a1000;font-weight:800;padding:12px 26px;font-size:15px;letter-spacing:.06em}
#stats{margin:6px 0 2px;text-align:left;font-size:11px;color:var(--mut)}
#stats div{display:flex;align-items:center;gap:8px;margin:3px 0}
#stats em{font-style:normal;width:132px}
#stats u{flex:1;height:6px;background:#1a2040;border-radius:3px;overflow:hidden;text-decoration:none}
#stats s{display:block;height:100%;background:var(--ac);text-decoration:none}
#cash{margin:6px 0;font-weight:700;color:var(--ac)}
#lst{display:flex!important;flex-direction:row;overflow-x:auto!important;overflow-y:hidden!important;max-height:none!important;gap:6px;border:0!important;margin:4px 0!important;scroll-snap-type:x proximity}
#lst div{flex:0 0 auto!important;flex-direction:column;align-items:center;gap:0!important;padding:4px 9px!important;border-radius:8px;background:#161b36;font-size:10px;text-align:center;white-space:nowrap;scroll-snap-align:center}
#lst .cur{outline:1px solid var(--ac)}
#gridv{position:fixed;inset:0;background:rgba(3,5,12,.97);z-index:5;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 16px}
#gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--ac);font-weight:800;letter-spacing:.1em}
#gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
#gg div{background:#121731;border:1px solid #2a3150;border-radius:10px;padding:8px;font-size:11px;cursor:pointer;color:var(--fg)}
#gg div b{display:block;font-size:12px;margin-bottom:2px}
#gg i{font-style:normal;color:var(--mut)}
#gg .own i{color:#7ddc8c}
#gg .cur{border-color:var(--ac)}
#brand{margin:2px 0 4px;gap:6px}
#ov #brand button{font-size:12px;padding:4px 12px}
#ov{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);width:min(92vw,330px);padding:8px 10px;max-height:none;overflow:visible;border-radius:12px}
#ov h1{font-size:15px;margin:0 0 2px}
#ov p{font-size:11px;margin:2px 0}
#ov #hint{font-size:9px}
#pick{margin:4px 0;gap:6px}
#pick span{min-width:150px;font-size:14px}
#pick span small{font-size:9px}
#pick span i{font-size:10px}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;font-size:10px;margin:2px 0}
#stats em{width:66px;white-space:nowrap}
#cash{margin:2px 0;font-size:12px}
#ov button{padding:5px 11px;font-size:15px}
#ov #go{padding:8px 18px;font-size:13px}
#lst{position:relative;max-height:22vh;overflow-y:auto;text-align:left;margin:6px 0;font-size:12px;border:1px solid #2a3150;border-radius:8px}
#lst div{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;cursor:pointer}
#lst .cur{background:#20274a;color:var(--ac)}
#lst .own span:last-child{color:#7ddc8c}
#brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 0}
#brand span{min-width:200px;font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--ac);text-transform:uppercase}
.hide{display:none!important}

function act(){const m=PMd();if(owned(m))start();else if(cash>=m.price){cash-=m.price;own.push(m.id);save();label()}}
function cyc(d){const n=LST().length;sel=(sel+d+n)%n;colI=0;label()}
function cybr(d){bi=d>0?1:0;sel=0;colI=0;label()}
$('pv').onclick=()=>cyc(-1);$('nx').onclick=()=>cyc(1);$('bp').onclick=()=>cybr(-1);$('bx').onclick=()=>cybr(1);$('lst').onclick=e=>{const d=e.target.closest('div[data-i]');if(d){sel=+d.dataset.i;colI=0;label()}};
function openGrid(){const ls=LST();$('gg').innerHTML=ls.map((c,i)=>'<div data-i="'+i+'" class="'+(i===sel?'cur ':'')+(owned(c)?'own':'')+'"><b>'+c.b+' '+c.n+'</b><i>'+(owned(c)?'Owned':'$'+c.price)+'</i> · '+c.top+' km/h</div>').join('');$('gridv').classList.remove('hide');const cu=$('gg').querySelector('.cur');if(cu)$('gridv').scrollTop=cu.offsetTop-80}
$('gb').onclick=openGrid;$('gx').onclick=()=>$('gridv').classList.add('hide');
$('gg').onclick=e=>{const d=e.target.closest('div[data-i]');if(d){sel=+d.dataset.i;colI=0;$('gridv').classList.add('hide');label()}};
addEventListener('keydown',e=>{if(e.key==='Escape')$('gridv').classList.add('hide')});
let sx=null,lw=0;$('c').addEventListener('wheel',e=>{if(st!=='play'&&performance.now()-lw>150){lw=performance.now();cyc((e.deltaY||e.deltaX)>0?1:-1)}},{passive:true});
$('c').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});$('c').addEventListener('touchend',e=>{if(st!=='play'&&sx!==null){const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)cyc(dx<0?1:-1)}sx=null},{passive:true});$('cl').onclick=()=>{colI++;rebuild()};$('go').onclick=act;
function snd(){try{ac=new AudioContext();osc=ac.createOscillator();osc.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;gn=ac.createGain();gn.gain.value=.05;osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){}}
function start(){for(const c of cars)sc.remove(c.g);cars=[];P=60;dist=0;bonus=0;spts=0;vx=0;spawnT=0;shake=0;flash=null;px=camX=1.8;pc.rotation.set(0,0,0);st='play';$('ov').classList.add('hide');$('hud').classList.remove('hide');try{if(!ac)snd();else gn.gain.value=.05;ac.resume()}catch(e){}}
function crash(){st='over';shake=1.2;for(let i=0;i<40;i++){const s=new T.Sprite(SM(0xff9030));s.position.set(px,.8,0);s.scale.set(.4,.4,1);s.userData={v:new T.Vector3((Math.random()-.5)*14,Math.random()*9,(Math.random()-.5)*14),l:.6+Math.random()*.8};sc.add(s);pts.push(s)}
try{gn.gain.value=0}catch(e){}const score=Math.floor(spts)+bonus;const earn=Math.floor(score*.5);cash+=earn;save();if(score>best){best=score;try{localStorage.setItem('mh_best',best)}catch(e){}}
$('ti').textContent='WRECKED';$('sub').textContent='Score '+score+' · Best '+best+' · Earned $'+earn;$('ov').classList.remove('hide');label(1)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='r'&&st!=='menu')toMenu();if(st!=='play'){if(k==='arrowleft')cyc(-1);if(k==='arrowright')cyc(1);if(k==='arrowup')cybr(-1);if(k==='arrowdown')cybr(1);if(k==='enter'||k===' ')act()}if(k.startsWith('arrow')||k===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function tt(e){touch.l=touch.r=0;if(st==='play')for(const t of e.touches){if(t.clientX<innerWidth/2)touch.l=1;else touch.r=1}e.preventDefault()}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>$('c').addEventListener(n,tt,{passive:false}));
function toMenu(){for(const c of cars)sc.remove(c.g);for(const p of pts)sc.remove(p);cars=[];pts=[];P=0;vx=0;dist=0;spawnT=0;shake=0;px=camX=1.8;st='menu';pc.rotation.set(0,0,0);$('ti').textContent='MIDNIGHT HIGHWAY';$('sub').textContent='Earn cash from every run, unlock faster cars.';$('ov').classList.remove('hide');$('hud').classList.add('hide');try{gn.gain.value=0}catch(e){}label()}
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
function pick(){let r=Math.random()*WT;for(const m of M){r-=m.wt;if(r<=0)return m}return M[0]}
function spawn(){const lane=Math.random()*4|0,m=pick(),front=lane<2,s=front?-(60+Math.random()*50):m.semi?75+Math.random()*20:70+Math.random()*80;
const z=s>P+10?28:-330-P*.9-Math.random()*40,x=-7.2+3.6*(lane+.5)+(Math.random()-.5)*.3;
if(z>0&&Math.abs(x-px)<2.6)return;if(cars.length>=Math.min(28,8+dist/250))return;const nl=new Set(cars.filter(c=>Math.abs(c.z-z)<30).map(c=>Math.floor((c.x+7.2)/3.6)));if(nl.size>=3&&!nl.has(lane))return;if(cars.some(c=>Math.abs(c.x-x)<1.8&&Math.abs(c.z-z)<(m.semi?40:26)))return;
const col=m.cols[Math.random()*m.cols.length|0],g=mk(m,col,front);sc.add(g);cars.push({m,g,x,z,s,front,passed:false})}
function update(dt){tm+=dt;const PM=PMd();
if(st==='play'){const L=keys.arrowleft||keys.a||touch.l,R_=keys.arrowright||keys.d||touch.r,sp=(4+P/40)*(.8+PM.hnd*.5);
vx+=(((R_?1:0)-(L?1:0))*sp-vx)*Math.min(1,dt*(3+PM.hnd*8));px=clamp(px+vx*dt,-7.2+PM.w/2+.15,7.2-PM.w/2-.15);
const base=Math.min(PM.top*.6,90+dist/60);let tg=base;const full=keys.arrowup||keys.w;const br=keys.arrowdown||keys.s;
let gap=99;for(const c of cars)if(!c.front&&c.z<-2&&Math.abs(c.x-px)<1.5){const g=-c.z-(c.m.L+PM.L)/2;if(g<gap)gap=g}const cl=clamp(1-(gap-3)/35,0,1);window.dft=cl>0;window.dcl=cl;const ae=PM.acc*28,vt=PM.top,cc=ae/(vt*vt)*(1-.55*cl);if(br)P=Math.max(30,P-((8+PM.brk*7)*3.6+cc*P*P)*dt);else{const a=full?ae:Math.min(ae,Math.max(-12,(tg*(1+.15*cl)-P)*PM.acc*1.5));P=Math.max(30,P+(a-cc*P*P)*dt)}P=Math.min(P,PM.top*(1+.1*cl));dist+=P/3.6*dt;spts+=P/3.6*dt*.1*(.5+Math.pow(P/150,1.5));
spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.15,1.3-dist/6000)*(90/Math.max(P,60));spawn()}}
else if(st==='over')P=Math.max(0,P-dt*90),dist+=P/3.6*dt;
camX+=(px-camX)*Math.min(1,dt*5);
for(const c of cars){if(!c.front)for(const d of cars)if(d!==c&&!d.front&&Math.abs(d.x-c.x)<1.5&&d.z<c.z&&c.z-d.z<(c.m.L+d.m.L)/2+14&&c.s>d.s)c.s=d.s;c.z+=(P-c.s)/3.6*dt;c.g.position.set(c.x,0,c.z)}
cars=cars.filter(c=>{if(c.z>45||c.z<-1000){sc.remove(c.g);return false}return true});
if(st==='play'){for(const c of cars){const dx=Math.abs(c.x-px),dz=Math.abs(c.z),ox=(c.m.w+PM.w)/2,oz=(c.m.L+PM.L)/2;
if(dx<ox*.92&&dz<oz*.9){crash();break}
if(!c.passed&&dz<oz&&dx<ox+.9&&P>60){c.passed=true;bonus+=Math.round(10*(.5+Math.pow(P/150,1.5)));flash=1;$('sub').textContent=''}}
const s=Math.floor(spts)+bonus;$('sc').textContent=s;$('bs').textContent=Math.max(best,s);$('sp').textContent=(P|0)+' ×'+(.5+Math.pow(P/150,1.5)).toFixed(1)+(window.dft?' · draft '+Math.round(window.dcl*100)+'%':'')}
if(osc)osc.frequency.value=40+P*.8;
for(const p of pts){const u=p.userData;p.position.addScaledVector(u.v,dt);u.v.y-=18*dt;u.l-=dt;p.material=SM(0xff9030);if(u.l<=0){sc.remove(p)}}pts=pts.filter(p=>p.userData.l>0);
shake*=Math.pow(.02,dt)}
function frame(dt){const PM=PMd();
pc.position.x=px;pc.rotation.z=-vx*.012;if(st==='play')pc.rotation.y=-vx*.02;
if(pc.userData.tail)pc.userData.tail.color.setHex(keys.arrowdown||keys.s?0xff6a50:0xcc1812);
sl[0].position.set(px-.7,.8,-PM.L/2);sl[1].position.set(px+.7,.8,-PM.L/2);sl[0].target.position.set(px-.7,0,-45);sl[1].target.position.set(px+.7,0,-45);
rt.offset.y=(dist/24)%1;lampG.position.z=dist%90;postG.position.z=dist%6;
const d=new T.Object3D(),v=P/3.6*dt;for(let i=0;i<TN;i++){const t=trees[i];t.z+=v;if(t.z>25)rt_(t,t.z-380-Math.random()*30);d.position.set(t.x,3.5*t.s,t.z);d.scale.set(t.s,t.s,t.s);d.updateMatrix();tm_.setMatrixAt(i,d.matrix)}tm_.instanceMatrix.needsUpdate=true;
const sk=shake*.4+(P>200?(P-200)/700:0);
if(st!=='play'){const a=PM.ph?Math.sin(tm*.5)*.4:tm*.35,r=PM.L*1.25+2;cam.position.set(px+Math.sin(a)*r,1.5+Math.sin(tm*.5)*.25,Math.cos(a)*r);cam.lookAt(px,-.3,0);cam.fov=45}
else{cam.fov=(innerWidth/innerHeight<.8?74:60)+P*.03;cam.position.set(camX,2.4+PM.h*.45,7+PM.L*.12);cam.position.x+=(Math.random()-.5)*sk;cam.position.y+=(Math.random()-.5)*sk;cam.lookAt(camX*.4+px*.6,1.2,-20)}
sc.fog.density=.0045/(1+P/250);cam.updateProjectionMatrix();sky.position.copy(cam.position);R.render(sc,cam)}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);frame(dt);requestAnimationFrame(loop)}
label();requestAnimationFrame(loop);
</script></body></html>
